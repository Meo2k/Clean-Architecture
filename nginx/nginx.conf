upstream api_cluster {
    # Fail fast: only allow 1-2 fails before removing unhealthy node for 10s
    server api_1:8000 max_fails=2 fail_timeout=10s;
    server api_2:8000 max_fails=2 fail_timeout=10s;

    # Keepalive connections to upstream servers
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Pass client headers and connection properties
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Custom header to expose which backend container served the request
    add_header X-Upstream-Backend $upstream_addr always;

    location / {
        proxy_pass http://api_cluster;
        
        # Internal connection timeout should be fast (1s) so failover happens instantly
        proxy_connect_timeout 1s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Failover immediately to next upstream server in case of errors, timeouts, or connection failures
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_timeout 5s;
        proxy_next_upstream_tries 2;
    }
}
