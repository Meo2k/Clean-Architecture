services:
  # 1. Database
  postgres:
    image: postgres:16-alpine
    container_name: clean_arch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Caching
  redis:
    image: redis:7-alpine
    container_name: clean_arch_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. API Instance 1
  api_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clean_arch_api_1
    restart: unless-stopped
    environment:
      SERVER_ID: api_instance_1
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/db
      REDIS_URL: redis://redis:6379/0
      ACCESS_TOKEN_KEY: token_secret_demo_key_1234567890_cluster
      REFRESH_TOKEN_KEY: refresh_secret_demo_key_1234567890_cluster
      ENVIRONMENT: PRODUCTION
      CACHE_ENABLED: "true"
      CACHE_DEFAULT_TTL: "60"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  # 4. API Instance 2
  api_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clean_arch_api_2
    restart: unless-stopped
    environment:
      SERVER_ID: api_instance_2
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/db
      REDIS_URL: redis://redis:6379/0
      ACCESS_TOKEN_KEY: token_secret_demo_key_1234567890_cluster
      REFRESH_TOKEN_KEY: refresh_secret_demo_key_1234567890_cluster
      ENVIRONMENT: PRODUCTION
      CACHE_ENABLED: "true"
      CACHE_DEFAULT_TTL: "60"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  # 5. Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: clean_arch_load_balancer
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api_1
      - api_2

  # 6. Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: clean_arch_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - api_1
      - api_2

  # 7. Grafana Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: clean_arch_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

