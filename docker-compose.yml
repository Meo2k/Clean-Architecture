services:
  # 1. Database
  postgres:
    image: postgres:16-alpine
    container_name: clean_arch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Caching
  redis:
    image: redis:7-alpine
    container_name: clean_arch_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. API Instance 1
  api_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clean_arch_api_1
    restart: unless-stopped
    environment:
      SERVER_ID: api_instance_1
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/db
      REDIS_URL: redis://redis:6379/0
      ACCESS_TOKEN_KEY: token_secret_demo_key_1234567890_cluster
      REFRESH_TOKEN_KEY: refresh_secret_demo_key_1234567890_cluster
      ENVIRONMENT: PRODUCTION
      CACHE_ENABLED: "true"
      CACHE_DEFAULT_TTL: "60"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  # 4. API Instance 2
  api_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clean_arch_api_2
    restart: unless-stopped
    environment:
      SERVER_ID: api_instance_2
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/db
      REDIS_URL: redis://redis:6379/0
      ACCESS_TOKEN_KEY: token_secret_demo_key_1234567890_cluster
      REFRESH_TOKEN_KEY: refresh_secret_demo_key_1234567890_cluster
      ENVIRONMENT: PRODUCTION
      CACHE_ENABLED: "true"
      CACHE_DEFAULT_TTL: "60"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  # 5. Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: clean_arch_load_balancer
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api_1
      - api_2

volumes:
  postgres_data:
  redis_data:
